# SkoolLedger — local installation
#
#   1. Create `.env` (run scripts/install.sh or scripts/install.ps1, or copy
#      .env.example and fill in the secrets).
#   2. docker compose up -d
#   3. Open http://localhost (or http://<this-computer's-IP> from other PCs).
#
# See docs/INSTALLATION.md for details.

name: skoolledger

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skoolledger}
      POSTGRES_USER: ${POSTGRES_USER:-skoolledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    # PostgreSQL is deliberately NOT published to the network.
    # See docs/INSTALLATION.md ("Connecting a database tool") if you need it.

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: skoolledger/api:${SKOOLLEDGER_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-skoolledger}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skoolledger}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: '1'
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: /app/uploads
      LOGO_MAX_BYTES: ${LOGO_MAX_BYTES:-1048576}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      INITIAL_SCHOOL_NAME: ${INITIAL_SCHOOL_NAME:-My School}
      INITIAL_CURRENCY: ${INITIAL_CURRENCY:-PKR}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-System Administrator}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@skoolledger.local}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: skoolledger/web:${SKOOLLEDGER_VERSION:-latest}
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  db-data:
  uploads:
