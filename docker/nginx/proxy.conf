# SkoolLedger entry point. Browsers on the school network connect here.
#   /api/*  -> NestJS API container
#   /*      -> web (React) container
# To enable HTTPS later, add a `listen 443 ssl` server block here with your
# certificate and set COOKIE_SECURE=true in .env.

upstream skoolledger_api {
    server api:3000;
    keepalive 16;
}

upstream skoolledger_web {
    server web:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Logo uploads are limited to a few MB by the API; this is the outer cap.
    client_max_body_size 6m;

    # Security headers for every response.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        proxy_pass http://skoolledger_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite (never append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://skoolledger_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
