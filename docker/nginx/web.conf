# Serves the built React single-page app inside the `web` container.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Fingerprinted build assets never change, so browsers may cache them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the app shell; always revalidate so updates appear immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
